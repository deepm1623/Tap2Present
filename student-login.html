
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Tap2Present</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-role="student" class="auth-page">

    <header class="auth-navbar">
        <a href="index.html" class="brand">
            <img src="assets/images/logo.png" alt="Tap2Present Logo">
            <span>Tap2<span>Present</span></span>
        </a>

        <a href="index.html" class="back-home">← Back to Home</a>
    </header>

    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-icon">🎓</div>

            <p class="auth-label">STUDENT PORTAL</p>

            <h1>Welcome <span>Back.</span></h1>

            <p class="auth-description">
                Sign in to access your attendance and academic records.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <p id="message" class="auth-message"></p>

                <button type="submit" class="auth-submit">
                    Sign In <span>→</span>
                </button>

            </form>

            <div class="auth-bottom">
                <p>Are you faculty or admin?</p>
                <a href="login.html">Choose another portal</a>
            </div>

        </section>

    </main>

    <footer class="auth-footer">
        © 2026 Tap2Present. All rights reserved.
    </footer>

    <script type="module" src="app.js"></script>

<script src="js/Common/popups.js"></script>
</body>
</html>
