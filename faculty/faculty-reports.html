<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Reports | Tap2Present</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/faculty/faculty-reports.css">
</head>
<body class="dashboard-page">
<div class="dashboard-layout">
    <aside class="dashboard-sidebar">
        <a href="faculty-dashboard.html" class="brand">
            <img src="../assets/images/logo.png" alt="Tap2Present">
            <span>Tap2<span>Present</span></span>
        </a>
        <p class="sidebar-heading">FACULTY MENU</p>
        <nav class="sidebar-nav">
            <a href="faculty-dashboard.html">▦ Dashboard</a>
            <a href="manage-classes.html">▤ Manage Classes</a>
            <a href="take-attendance.html">◉ Take Attendance</a>
            <a class="active" href="faculty-reports.html">▥ Reports</a>
        </nav>
        <div class="sidebar-bottom"><a href="#" class="logout-link" data-logout>↪ Logout</a></div>
    </aside>
    <main class="dashboard-main">
        <div class="page-title">
            <p class="dashboard-date">FACULTY PORTAL</p>
            <h1>Reports</h1>
            <p class="dashboard-subtitle">Attendance recorded by your faculty account.</p>
        </div>
        <p id="reportsMessage" class="dashboard-message">Loading attendance reports...</p>
        <section class="data-card">
            <h2>Subject summary</h2>
            <div id="subjectSummary"></div>
        </section>
        <section class="data-card" style="margin-top:24px">
            <h2>Recent records</h2>
            <div class="table-wrapper">
                <table class="attendance-table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Subject</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody">
                        <tr><td colspan="4" class="empty-history">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script type="module" src="../js/faculty/faculty-reports.js"></script>
<script src="../js/Common/popups.js"></script>
</body>
</html>
